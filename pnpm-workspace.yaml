# Single-package workspace. `packages` must be present so older pnpm
# versions (like the one Cloudflare's CI uses) can read this file.
packages:
  - .
# Build scripts allowed for pnpm 10 (onlyBuiltDependencies) and pnpm 11+
# (allowBuilds). Without these, installing workerd/esbuild aborts.
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20260910.0-alpha
  - wrangler@4.131.0
